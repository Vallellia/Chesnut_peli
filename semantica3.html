<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <title>Estructura con Columnas</title>
    <style>
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #4e89b6;
            padding: 10px 20px;
        }

        .logo-pequeno {
            width: 50px;
            height: auto;
            display: block;
        }


        .logo-cabecera {
            max-width: 100%;
            height: auto;
            display: block;
            margin-bottom: 15px;
        }
        .barra-navegacion{
            display: flex;
            gap:15px;
            margin-top: 10px;
        }
        .boton-nav{
            text-decoration: none;
            color:beige;
            background-color: #3976a5;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            font-family: sans-serif;
            transition: background-color 0.3s;
        }
        .boton-nav:hover {
            background-color:#041e93;
            color: #d6cbcb;
        }
         .boton-nav.activo {
            background-color:#2f5a7b;
            color:#ffffff;
            font-weight: bold;
        }
    
        main {
            display: flex;
            gap: 20px;
        }

        aside {
            width: 30%;
            background-color: #b8bfff;
            padding: 15px;
        }

        section {
            width: 75%;
            background-color: #dfc4ff;
            padding: 15px;
        }
        body {
            background-color:#ffffff;

        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 style="margin: 0; color:#ffffff;" >Mi Sitio Web</h1>
            <nav style="color:#ffffff;">Menú de navegación</nav>
            <nav class ="barra-navegacion">
                <a href="index.html" class="boton-nav">Inicio</a>
                <a href="semantica2.html" class="boton-nav">Otro1</a>
                <a href="semantica3.html" class="boton-nav activo">Otro2</a>
            </nav>
        </div>
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcpeL4MLjaiW0OGJ8B9QyfoL0LgS-DDi4uiJyop7NOPg&s=10" alt="Logo de Mi Sitio Web" class="logo-cabecera" width="200" height="100">
    </header>
    <main>
        <aside>
            <h3>Barra Lateral</h3>
            <p>Enlaces, publicidad o categorías.</p>
        </aside>
        <section>
            <article>
                <h2>Artículo Principal</h2>
                <p>Contenido del artículo...</p>
            </article>
        </section>
    </main>

    <footer>
        <p style="color:#ffffff;">Pie de página</p>
    </footer>
</body>
</html>
